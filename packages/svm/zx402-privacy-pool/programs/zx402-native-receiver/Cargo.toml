[package]
name = "zx402-native-receiver"
version = "0.1.0"
description = "Example native Solana receiver for atomic zBase private payments"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zx402_native_receiver"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "zx402-privacy-pool/idl-build",
]

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
zx402-privacy-pool = { path = "../zx402-privacy-pool", features = ["cpi"] }
